name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "requirements.txt"
      - "video_motion_control.spec"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean video_motion_control.spec

      - name: Create release ZIP
        shell: pwsh
        run: |
          $destination = "VideoMotionControl-Windows-x64.zip"
          Compress-Archive -Path "dist\VideoMotionControl\*" -DestinationPath $destination -Force
          Get-Item $destination | Select-Object Name, Length

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: VideoMotionControl-Windows-x64
          path: VideoMotionControl-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
