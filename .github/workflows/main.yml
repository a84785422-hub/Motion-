name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10.0"

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onefile `
            --name "MotionControlAI" `
            --collect-all mediapipe `
            app/main.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist\MotionControlAI.exe")) {
            Write-Error "L'executable n'a pas ete genere."
            exit 1
          }
          Get-Item "dist\MotionControlAI.exe" | Select-Object FullName, Length

      - name: Create release ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\MotionControlAI.exe" `
            -DestinationPath "MotionControlAI-Windows-x64.zip" `
            -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: MotionControlAI-Windows-x64
          path: MotionControlAI-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
